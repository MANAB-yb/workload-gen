spring.application.name=workload-gen

# Defaults only. Everything below is overridden by the CLI (see README.md) at startup; the values
# here just let the application and the test context start without any arguments.
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.name=default
spring.datasource.username=yugabyte
spring.datasource.password=
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/yugabyte
spring.datasource.hikari.maximumPoolSize=50
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Bound every statement so a mis-calibrated query fails fast and is counted as a failure
# instead of wedging a workload thread for the whole run. Generous relative to the ~1s
# target per query, but still well under the DDL/load times it also applies to.
# Override with --statement-timeout.
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=60000
spring.datasource.hikari.data-source-properties.socketTimeout=120

# The workload's own progress lines are the useful output; keep Spring's startup quiet.
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{0} - %X{chain}%msg%n
